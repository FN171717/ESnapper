# ESnapper-Konfiguration. Jede Suche wird bei jedem Lauf abgefragt.
marketplace: EBAY_DE
delivery_country: DE
location_country: DE        # nur Artikel aus Deutschland (Ausland: Zoll, lange Lieferzeit, teurer Versand); leer = auch Ausland
home_postal_code: "25712"   # für den Umkreis bei Abholung (max_distance_km)

# Tageslimit der eBay-API ist 5.000 Aufrufe. ESnapper verteilt dieses Budget gleichmäßig über den Tag
# und lässt eine Suche aus, wenn sie es gerade überziehen würde (die Suchen oben haben Vorrang).
daily_api_limit: 4500

# Für ALLE Suchen gesperrt: Domains und Webseiten.
# exclude_categories: Teilwort im eBay-Kategoriepfad des Artikels (Groß/klein egal).
# exclude_title_patterns: reguläre Ausdrücke für den Titel (\b = Wortgrenze, "Domaine" beim Wein bleibt erlaubt).
exclude_categories: ["domain", "website", "webseite"]
exclude_title_patterns: ['\bdomains?\b', '\bdomainnamen?\b', '\bwebsites?\b', '\bwebseiten?\b']

# Vorlaufzeit: Gemeldet wird nur, was noch mindestens min_minutes_left (120 = 2 Stunden) läuft.
# Das Zeitfenster ends_within_hours (3,5 h) ist größer, weil GitHub die Läufe oft nur etwa stündlich startet:
# So wird jede Auktion mindestens einmal gesehen, solange noch 2 bis 3,5 Stunden übrig sind.

# Wie viele neue Artikel pro Lauf höchstens mit Vergleichspreisen bewertet werden.
# Hält den Verbrauch unter dem Tageslimit der eBay-API (5.000 Aufrufe). 96 Läufe × 25 ≈ 2.400 Vergleichssuchen pro Tag.
max_new_items_per_run: 25

searches:
  # Alle Suchen: nur Auktionen mit Sofortkauf-Option, Gebot gegen Sofortkaufpreis.
  # Treffer nur, wenn BEIDES erfüllt ist: mindestens min_difference Euro UND mindestens min_saving günstiger.
  - name: Business & Industrie
    category_ids: ["12576"]
    keywords: ""              # optional, z. B. "Festool" oder "Hilti"
    ends_within_hours: 3.5    # nur Auktionen, die in dieser Zeit enden
    min_minutes_left: 120     # Meldung nur, wenn noch mindestens so viele Minuten bleiben
    # sofortkauf = nur Auktionen mit Sofortkauf-Option, Gebot gegen Sofortkaufpreis (schnell, robust)
    # vergleich  = auch Auktionen ohne Sofortkauf, Preis aus ähnlichen Angeboten (langsamer, ungenauer)
    compare: sofortkauf
    max_auctions: 1500        # so viele bald endende Auktionen je Kategorie und Lauf durchsehen (200 pro API-Aufruf)
    min_difference: 200       # mindestens so viele Euro günstiger
    min_saving: 0.75          # und mindestens so viel Prozent günstiger (0.75 = Gebot höchstens 25 % des Sofortkaufpreises)
    min_price: 0              # aktuelles Gebot in EUR (0 = auch 1-€-Starts)
    max_price: 2000
    max_shipping: 50          # Versandkosten in EUR, leer = egal
    max_distance_km: 400      # nur für Artikel ohne Versand (Abholung): Umkreis um home_postal_code
    conditions: []            # z. B. ["NEW", "USED"]; leer = alle
    exclude_words: ["defekt", "ersatzteil", "bastler", "ohne funktion"]
    min_seller_feedback: 97   # Prozent positive Bewertungen

  - name: Heimwerker & Werkzeug
    category_ids: ["3187", "34998"]   # Heimwerker (inkl. Werkzeuge), Auto & Motorrad: Teile > Werkzeuge
    ends_within_hours: 3.5
    min_minutes_left: 120
    compare: sofortkauf
    max_auctions: 1500
    min_difference: 200
    min_saving: 0.75
    min_price: 0
    max_price: 2000
    max_shipping: 50
    max_distance_km: 400
    exclude_words: ["defekt", "ersatzteil", "bastler", "ohne funktion"]
    min_seller_feedback: 97

  - name: Fahrzeuge
    category_ids: ["9800"]    # Auto & Motorrad: Fahrzeuge
    pickup: true              # meist nur Abholung: Standort Deutschland statt Lieferung nach Deutschland
    max_distance_km: 400      # bei pickup für alle Artikel: Umkreis um home_postal_code
    ends_within_hours: 3.5
    min_minutes_left: 120
    compare: sofortkauf
    max_auctions: 1500
    min_difference: 200
    min_saving: 0.75
    min_price: 0
    max_price: 100000
    exclude_words: ["defekt", "motorschaden", "getriebeschaden", "unfall", "export", "bastler", "ersatzteil"]
    min_seller_feedback: 95

  - name: Alle übrigen Kategorien
    # Alle eBay.de-Hauptkategorien außer den oben eigens gesuchten (12576, 3187, 9800) und außer
    # Sammeln & Seltenes (1), Antiquitäten & Kunst (353), Kleidung & Accessoires (11450): auf Wunsch raus.
    # Liste mit dem Workflow "Kategorien suchen" (ohne Suchbegriff) abrufbar.
    # Läuft bei jedem Lauf, solange das Tagesbudget (daily_api_limit) reicht.
    category_ids: ["99", "220", "260", "267", "281", "293", "619", "625", "888", "1249",
                   "1281", "1305", "2984", "3252", "9815", "10542", "11116", "11232", "11233",
                   "11700", "14308", "14339", "15032", "20710", "22128", "26395", "58058", "131090", "159912"]
    ends_within_hours: 3.5
    min_minutes_left: 120
    compare: sofortkauf
    max_auctions: 2000        # je Kategorie (200 pro API-Aufruf); hoch genug, um bis 3,5 h vor Ende zu kommen
    min_difference: 200
    min_saving: 0.75
    min_price: 0
    max_price: 5000
    max_shipping: 50
    max_distance_km: 400
    exclude_words: ["defekt", "ersatzteil", "bastler", "ohne funktion", "leerkarton", "nur ovp", "attrappe"]
    min_seller_feedback: 97
